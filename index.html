<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Try a Cabrio frame on, right in your browser." />
    <meta name="keywords" content="Cabrio Eyewear Mirror" />
    <!-- Wat er te zien is als iemand deze link deelt. Deze pagina bestaat om doorgestuurd
         te worden ("probeer deze bril eens"), en zonder deze regels is dat een grijze
         rechthoek met een domeinnaam eronder. Het adres van het plaatje moet absoluut zijn:
         de meeste scrapers weigeren een relatief pad, ook al werkt het in de browser. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cabrio-eyewear-mirror.com/" />
    <meta property="og:title" content="Cabrio Eyewear Mirror" />
    <meta property="og:description" content="Try a Cabrio frame on, right in your browser." />
    <meta property="og:image" content="https://cabrio-eyewear-mirror.com/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cabrio Eyewear Mirror</title>
    <!-- De pas-app staat op een ander domein, en de browser begint daar pas aan te bouwen
         zodra hij het iframe tegenkomt: DNS, TLS en verbinding vallen dan achter deze
         pagina. Vooraf verbinden haalt dat naar voren. -->
    <link rel="preconnect" href="https://cabrio.owiz.fittingbox.com" crossorigin>
    <link rel="dns-prefetch" href="https://cabrio.owiz.fittingbox.com">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500&display=swap" rel="stylesheet"> -->
    <style>
        body {
            box-sizing: border-box;
            height: calc(100vh);
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #000;
            color: #FFF;
        }
        .row {
            max-width: 1300px; 
            margin: 0 auto;
        }
        .col {
            padding: 0 1em;
        }
        .header__inner {
            display: flex;
            align-items: flex-end;
            padding: 1em 0;
        }
        .header__logo {
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            width: 200px;
        }
        .header__logo:before {
            content: '';
            display: block;
            padding-bottom: 60%;
        }
        .header__title {
            font-family: "Quicksand","Helvetica","Arial",sans-serif;
            font-size: .9em;
            font-weight: 500;
            padding: .5em 1em;
        }
        iframe {
            display: block;
            border: 0;
             height: calc(100vh - 152px );
        }
        @media only screen and (max-width: 767px) {
            .header__logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header">
            <div class="row">
                <div class="col">
                    <div class="header__inner">
                        <div class="header__logo" style="background-image: url('logo-white.svg');"></div>
                    
                    </div>
                </div>
            </div>
        </div>
    </header>
    <iframe id="mirror" width="100%" height="100%" data-src="https://cabrio.owiz.fittingbox.com"
            title="Cabrio Eyewear Mirror" frameborder="0" allow="microphone; camera"></iframe>
    <noscript>
        <iframe width="100%" height="100%" src="https://cabrio.owiz.fittingbox.com"
                title="Cabrio Eyewear Mirror" frameborder="0" allow="microphone; camera"></iframe>
    </noscript>
    <!-- Los bestand en niet inline, omdat de kopregel Content-Security-Policy inline
         javascript weigert. Dat kon ook met een hash van deze regels in _headers, maar dan
         breekt de pas-app zodra iemand hier een spatie wijzigt en vergeet de hash bij te
         werken: stil, en pas zichtbaar in productie. defer houdt het uit de weg van het
         tekenen en draait nog ruim voor het load-moment waar het op wacht. -->
    <script src="mirror.js" defer></script>
</body>
</html>
