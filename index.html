<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Die regel staat met opzet als eerste, en de uitleg erna: de specificatie leest de
         codering alleen in de eerste 1024 bytes van het document, dus alles wat ervoor
         staat gaat van dat venster af. Onder de og-regels stond ze op byte 1099 en viel ze
         er dus buiten. Dat brak vandaag niets, want Netlify stuurt de codering ook in de
         content-type-kopregel mee en die gaat voor. Maar wie deze pagina ooit van schijf
         opent of achter een tussenstation zet dat die kopregel niet doorgeeft, houdt een
         declaratie over die de browser nooit ziet. -->
    <meta name="description" content="Try a Cabrio frame on, right in your browser." />
    <meta name="keywords" content="Cabrio Eyewear Mirror" />
    <!-- Wat er te zien is als iemand deze link deelt. Deze pagina bestaat om doorgestuurd
         te worden ("probeer deze bril eens"), en zonder deze regels is dat een grijze
         rechthoek met een domeinnaam eronder. Het adres van het plaatje moet absoluut zijn:
         de meeste scrapers weigeren een relatief pad, ook al werkt het in de browser. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cabrio-eyewear-mirror.com/" />
    <meta property="og:title" content="Cabrio Eyewear Mirror" />
    <meta property="og:description" content="Try a Cabrio frame on, right in your browser." />
    <meta property="og:image" content="https://cabrio-eyewear-mirror.com/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- maximum-scale=1.0 verhindert pinch-zoom. Dat is een keuze en geen overgeschreven
         boilerplate, en ze staat hier opgeschreven omdat een meting haar anders terecht
         opnieuw als gebrek aanmerkt.

         De pas-app gebruikt zelf gebaren om een montuur op een gezicht te schuiven. Vangt
         de browser die pinch op als paginazoom, dan botst dat. Fittingbox declareert het
         in hun eigen document ook (user-scalable=no), maar de viewport-meta van een iframe
         wordt genegeerd: alleen die van het bovenliggende document telt. Deze regel is dus
         de enige plek waar hun bedoeling nog uitgevoerd kan worden.

         Wat het kost, staat er eerlijk bij: dit wijkt af van WCAG 1.4.4, en op een pagina
         die bestaat om een bril van dichtbij te bekijken is dat geen kleinigheid. Wat het
         nuanceert: iOS negeert maximum-scale sinds iOS 10, dus op elke iPhone is de pas-app
         al zoombaar en daar komt niets over terug. Het bijt alleen op Android.

         Weghalen kan zodra de gebaren binnen het iframe met touch-action afgeschermd zijn.
         Dat is het document van Fittingbox en niet het onze, dus dat is een vraag aan hen
         en geen regel die wij hier kunnen wijzigen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cabrio Eyewear Mirror</title>
    <!-- De pas-app staat op een ander domein, en de browser begint daar pas aan te bouwen
         zodra hij het iframe tegenkomt: DNS, TLS en verbinding vallen dan achter deze
         pagina. Vooraf verbinden haalt dat naar voren. -->
    <link rel="preconnect" href="https://cabrio.owiz.fittingbox.com" crossorigin>
    <link rel="dns-prefetch" href="https://cabrio.owiz.fittingbox.com">
    <!-- Deze pagina is overal met een tracking-staart achter het adres te bereiken
         ("?utm_source=..."), en elk van die adressen is voor een zoekmachine een aparte
         pagina met dezelfde inhoud. Deze regel wijst er één aan als het echte. -->
    <link rel="canonical" href="https://cabrio-eyewear-mirror.com/">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500&display=swap" rel="stylesheet"> -->
    <style>
        body {
            box-sizing: border-box;
            height: calc(100vh);
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #000;
            color: #FFF;
        }
        .row {
            max-width: 1300px; 
            margin: 0 auto;
        }
        .col {
            padding: 0 1em;
        }
        .header__inner {
            display: flex;
            align-items: flex-end;
            padding: 1em 0;
        }
        /* Het logo is het enige eigen beeld op deze pagina en dus wat de meting als
           grootste element ziet. Als achtergrondafbeelding werd het pas aangevraagd nadat
           de stijl was gelezen en de doos berekend; als img-element in de opmaak, met
           afmetingen en fetchpriority, ziet de browser het meteen bij het parsen staan.
           Zelfde doos, zelfde uitsnede: object-fit doet hier wat background-size: contain
           deed, ook onder 767 pixels. */
        .header__logo {
            display: block;
            width: 200px;
            aspect-ratio: 5 / 3;
            object-fit: contain;
            object-position: center center;
        }
        .header__title {
            font-family: "Quicksand","Helvetica","Arial",sans-serif;
            font-size: .9em;
            font-weight: 500;
            padding: .5em 1em;
        }
        /* Weggeschoven in plaats van display:none of visibility:hidden: wat niet getekend
           wordt, wordt door een schermlezer ook niet voorgelezen, en dan lost de kop het
           probleem niet op dat hij moest oplossen. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }
        iframe {
            display: block;
            border: 0;
             height: calc(100vh - 152px );
        }
        @media only screen and (max-width: 767px) {
            .header__logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header">
            <div class="row">
                <div class="col">
                    <div class="header__inner">
                        <img class="header__logo" src="logo-white.svg" alt="Cabrio"
                             width="200" height="120" fetchpriority="high">
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- De pagina had geen enkele kop. Wie hem met een schermlezer opent, hoort hooguit
         het merk en daarna andermans app in een frame, en nooit waar hij beland is.
         Zichtbaar staat het er wel al, in het logo en in de app zelf, dus deze kop wordt
         weggeschoven in plaats van getekend. -->
    <h1 class="visually-hidden">Cabrio Eyewear Mirror</h1>
    <iframe id="mirror" width="100%" height="100%" data-src="https://cabrio.owiz.fittingbox.com"
            title="Cabrio Eyewear Mirror" frameborder="0" allow="microphone; camera"></iframe>
    <noscript>
        <iframe width="100%" height="100%" src="https://cabrio.owiz.fittingbox.com"
                title="Cabrio Eyewear Mirror" frameborder="0" allow="microphone; camera"></iframe>
    </noscript>
    <!-- Los bestand en niet inline, omdat de kopregel Content-Security-Policy inline
         javascript weigert. Dat kon ook met een hash van deze regels in _headers, maar dan
         breekt de pas-app zodra iemand hier een spatie wijzigt en vergeet de hash bij te
         werken: stil, en pas zichtbaar in productie. defer houdt het uit de weg van het
         tekenen en draait nog ruim voor het load-moment waar het op wacht. -->
    <script src="mirror.js" defer></script>
</body>
</html>
